<header class="pb-6 border-b border-slate-800/80">
    <h1 class="text-3xl font-bold tracking-tight">Tracked Asset Items</h1>
    <p class="text-slate-400 text-sm mt-1">Select an asset item to review its historical payment trajectory logs.</p>
</header>

<section class="grid grid-cols-1 lg:grid-cols-3 gap-8 my-8">

    <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800/80 shadow-xl h-fit">
        <h3 class="font-bold text-sm text-slate-400 uppercase tracking-wider mb-4">Select Asset</h3>
        <div id="itemsNavList" class="space-y-2">
        </div>
    </div>

    <div class="lg:col-span-2 bg-slate-950 p-6 rounded-2xl border border-slate-800/80 shadow-xl">
        <h3 class="font-bold text-base text-slate-300 mb-4" id="itemDetailHeader">Item Statement History</h3>

        <div class="space-y-2.5 max-h-[500px] overflow-y-auto pr-1" id="itemPaymentsHistoryContainer">
            <div class="text-sm text-slate-500 text-center py-12">Select an asset from the list to pull previous payments.</div>
        </div>
    </div>

</section>
