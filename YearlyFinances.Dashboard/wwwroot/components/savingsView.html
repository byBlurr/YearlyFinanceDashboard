<header class="pb-6 border-b border-slate-800/80">
    <h1 class="text-3xl font-bold tracking-tight">Savings</h1>
    <p class="text-slate-400 text-sm mt-1">Tools to help with managing savings.</p>
</header>

<section class="grid grid-cols-1 md:grid-cols-2 gap-6 my-8">
    <form id="calculateSavingsForm" onsubmit="window.handleSavingsCalculateSubmit(event)" class="space-y-3.5 mt-4">
        <div class="flex justify-between items-center">
            <div>
                <h3 class="text-sm font-bold text-slate-200">Current Money Saved</h3>
                <p class="text-xs text-slate-500 mt-0.5">How much is currently saved?</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer select-none">
                <input type="number" id="calculateStartingMoney" required placeholder="2000" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none" />
            </label>
        </div>
        <div class="flex justify-between items-center">
            <div>
                <h3 class="text-sm font-bold text-slate-200">Amount per Month</h3>
                <p class="text-xs text-slate-500 mt-0.5">How much will be put into savings each month?</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer select-none">
                <input type="number" id="calculateAmoutToSave" required placeholder="50" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none" />
            </label>
        </div>
        <div class="flex justify-between items-center">
            <div>
                <h3 class="text-sm font-bold text-slate-200">Number of Months</h3>
                <p class="text-xs text-slate-500 mt-0.5">How long do you plan to save for?</p>
            </div>
            <span id="calculateNumberOfMonthsLabel" class="text-sm font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-xl font-mono border border-indigo-500/20">12 Months</span>
        </div>
        <input type="range" id="calculateNumberOfMonths" min="1" max="120" value="12" oninput="window.updateSavingNumberOfMonths(this.value)" class="w-full accent-indigo-500 h-1.5 bg-slate-900 rounded-lg cursor-pointer border border-slate-800" />
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium py-2 rounded-xl text-xs transition cursor-pointer">Calculate Savings</button>

        <div id="calculateSavingsResult">£0</div>
    </form>
</section>
