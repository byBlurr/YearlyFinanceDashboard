<div id="paymentModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl scale-95 transition-transform duration-300" id="modalBox">

        <div class="flex justify-between items-center pb-4 border-b border-slate-800/60">
            <h3 class="font-bold text-lg text-slate-200">Record New Payment</h3>
            <button onclick="window.closePaymentModal()" class="text-slate-500 hover:text-slate-300 text-sm cursor-pointer">✕</button>
        </div>

        <form id="paymentForm" onsubmit="window.handleFormSubmit(event)" class="space-y-4 mt-4">
            <select id="formItemId" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200"></select>
            <input type="number" id="formAmount" step="0.01" min="0.01" required placeholder="Amount Paid (£)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200" />
            <input type="date" id="formDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200" />

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-800/60 mt-6">
                <button type="button" onclick="window.closePaymentModal()" class="px-4 py-2 text-sm text-slate-400">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-500 transition cursor-pointer">Save Payment</button>
            </div>
        </form>

    </div>
</div>
